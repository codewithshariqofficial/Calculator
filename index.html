<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskCalc — Simple Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <section class="display" aria-live="polite">
            <div class="display-meta">
                <span class="expr-preview" id="exprPreview"></span>
            </div>
            <div class="display-main">
                <input type="text" id="result" readonly value="0" aria-label="Calculator display" tabindex="0" autofocus>
            </div>
            <div class="display-foot">
                <span id="statusText">Ready</span>
            </div>
        </section>

        <section class="buttons">
            <button class="btn btn-clear" data-action="clear">C</button>
            <button class="btn btn-clear" data-action="ce">CE</button>
            <button class="btn btn-op" data-value="%">%</button>
            <button class="btn btn-op" data-value="/">÷</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn btn-op" data-value="*">×</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn btn-op" data-value="-">−</button>

            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn btn-op" data-value="+">+</button>

            <button class="btn btn-zero" data-value="0">0</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn" data-value="sqrt(">√</button>
            <button class="btn btn-eq" data-action="equals">=</button>

            <button class="btn btn-back" data-action="backspace">⌫</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
